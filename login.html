<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFix - Student Login</title>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CampusFix heading -->
    <div class="header">
        CampusFix
    </div>

    <!-- Login form -->
    <div class="login-container">

        <h2>Student Login</h2>

        <form onsubmit="loginStudent(event)">

            <!-- Student ID / Email -->
            <label for="loginId">Student ID / Email</label>

            <input
                type="text"
                id="loginId"
                name="loginId"
                placeholder="Enter your student ID or email"
                required
            >

            <!-- Password -->
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <!-- Error message -->
            <p id="loginMessage"></p>

            <!-- Login Button -->
            <button type="submit">
                Login
            </button>

        </form>

        <!-- Register link -->
        <div class="links">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

        <!-- Home link -->
        <div class="links home-link">
            <a href="index.html">Back to Home</a>
        </div>

    </div>


    <!-- Temporary Login System -->
    <script>

        function loginStudent(event) {

            event.preventDefault();

            // Get entered details
            const studentId = document.getElementById("loginId").value;
            const password = document.getElementById("password").value;

            // Temporary demo credentials
            const correctStudentId = "MMDU001";
            const correctPassword = "123456";

            // Check login details
            if (
                studentId === correctStudentId &&
                password === correctPassword
            ) {

                // Correct details → open complaint page
                window.location.href = "complaint.html";

            } else {

                // Incorrect details → stay on login page
                document.getElementById("loginMessage").textContent =
                    "Invalid Student ID or Password.";

            }
        }

    </script>

</body>
</html>
